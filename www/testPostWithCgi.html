<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CGI Upload Tester</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #00ff88;
    --accent2: #7b5ea7;
    --danger: #ff4466;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #00ff88;
    --warning: #ffaa00;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 10% 10%, rgba(0,255,136,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 90% 80%, rgba(123,94,167,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  header {
    width: 100%;
    max-width: 820px;
    margin-bottom: 40px;
    display: flex;
    align-items: flex-end;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }
  .logo span { color: var(--accent); }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    padding-bottom: 2px;
  }

  .panel {
    width: 100%;
    max-width: 820px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .panel-header {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  .panel-body { padding: 20px 22px; }

  /* URL Row */
  .url-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .method-badge {
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 13px;
    padding: 0 14px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    letter-spacing: 1px;
  }

  input[type="text"], input[type="url"], textarea, select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,255,136,0.08);
  }

  /* Fields */
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 20px;
  }

  .fields-list { display: flex; flex-direction: column; gap: 8px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: center;
  }

  .btn-icon {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 18px;
    width: 38px; height: 38px;
    border-radius: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-family: monospace;
  }
  .btn-icon:hover { border-color: var(--danger); color: var(--danger); }
  .btn-icon.add:hover { border-color: var(--accent); color: var(--accent); }

  /* Drop Zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    margin-top: 8px;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: var(--accent);
    background: rgba(0,255,136,0.03);
  }
  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .drop-icon {
    font-size: 32px;
    margin-bottom: 10px;
    display: block;
    opacity: 0.5;
  }
  .drop-label {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }
  .drop-label strong { color: var(--accent); }

  /* File List */
  .file-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

  .file-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 14px;
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    gap: 10px;
    align-items: center;
    animation: slideIn 0.15s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .file-icon { font-size: 20px; text-align: center; }

  .file-info { min-width: 0; }
  .file-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .file-field-input {
    width: 160px;
    padding: 6px 10px;
    font-size: 12px;
  }

  .remove-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 4px;
    transition: color 0.15s;
  }
  .remove-btn:hover { color: var(--danger); }

  /* Send button */
  .send-btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 14px 40px;
    border-radius: 2px;
    cursor: pointer;
    margin-top: 22px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
  }
  .send-btn:hover { background: #00cc6a; box-shadow: 0 0 24px rgba(0,255,136,0.25); }
  .send-btn:active { transform: scale(0.98); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .send-btn.loading .spinner { display: block; }
  .send-btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Response panel */
  .response-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 2px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.status-2xx { background: rgba(0,255,136,0.12); color: var(--success); border: 1px solid rgba(0,255,136,0.2); }
  .badge.status-3xx { background: rgba(255,170,0,0.12); color: var(--warning); border: 1px solid rgba(255,170,0,0.2); }
  .badge.status-4xx, .badge.status-5xx { background: rgba(255,68,102,0.12); color: var(--danger); border: 1px solid rgba(255,68,102,0.2); }
  .badge.neutral { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  .response-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .tab {
    padding: 8px 18px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'JetBrains Mono', monospace;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 16px;
    font-size: 12px;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
    max-height: 400px;
    overflow-y: auto;
  }

  .headers-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .headers-table td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .headers-table td:first-child {
    color: var(--accent);
    white-space: nowrap;
    width: 40%;
    font-weight: 600;
  }
  .headers-table td:last-child { color: var(--text); word-break: break-all; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 30px;
  }

  .add-field-row { margin-top: 10px; }

  .row { display: flex; gap: 10px; align-items: center; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">CGI<span>/</span>POST</div>
  </div>
  <div class="tagline">multipart form-data tester</div>
</header>

<!-- Request Panel -->
<div class="panel">
  <div class="panel-header"><span class="dot"></span> Request</div>
  <div class="panel-body">

    <!-- URL -->
    <div class="url-row">
      <div class="method-badge">POST</div>
      <input type="url" id="url" placeholder="http://localhost/cgi-bin/upload.cgi" value="" />
    </div>

    <!-- Extra Fields -->
    <div class="section-label">Form Fields</div>
    <div class="fields-list" id="fields-list"></div>
    <div class="add-field-row row">
      <button class="btn-icon add" id="add-field-btn" title="Add field">+</button>
      <span style="font-size:11px;color:var(--muted)">add key / value pair</span>
    </div>

    <!-- Files -->
    <div class="section-label">Files</div>

    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" multiple />
      <span class="drop-icon">📂</span>
      <div class="drop-label">
        <strong>Click to browse</strong> or drag & drop files here<br />
        Multiple files supported — each gets its own field name
      </div>
    </div>

    <div class="file-list" id="file-list"></div>

    <button class="send-btn" id="send-btn">
      <div class="spinner"></div>
      <span class="btn-text">▶ Send Request</span>
    </button>

  </div>
</div>

<!-- Response Panel -->
<div class="panel" id="response-panel" style="display:none;">
  <div class="panel-header"><span class="dot" style="background:var(--accent2)"></span> Response</div>
  <div class="panel-body">

    <div class="response-meta" id="response-meta"></div>

    <div class="response-tabs">
      <button class="tab active" data-tab="body">Body</button>
      <button class="tab" data-tab="headers">Headers</button>
      <button class="tab" data-tab="raw">Raw Info</button>
    </div>

    <div class="tab-content active" id="tab-body">
      <pre id="response-body"></pre>
    </div>
    <div class="tab-content" id="tab-headers">
      <table class="headers-table" id="response-headers"></table>
    </div>
    <div class="tab-content" id="tab-raw">
      <pre id="response-raw"></pre>
    </div>

  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let files = [];      // [{file, fieldName}]
  let fieldRows = [];  // [{key, value, id}]
  let fieldIdCounter = 0;
  let fileIdCounter  = 0;

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const dropZone     = document.getElementById('drop-zone');
  const fileInput    = document.getElementById('file-input');
  const fileList     = document.getElementById('file-list');
  const fieldsList   = document.getElementById('fields-list');
  const sendBtn      = document.getElementById('send-btn');
  const responsePanel = document.getElementById('response-panel');

  // ── Helpers ────────────────────────────────────────────────────────────────
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function fileIcon(mime) {
    if (!mime) return '📄';
    if (mime.startsWith('image/')) return '🖼️';
    if (mime.startsWith('video/')) return '🎬';
    if (mime.startsWith('audio/')) return '🎵';
    if (mime.includes('pdf'))      return '📕';
    if (mime.includes('zip') || mime.includes('tar') || mime.includes('gz')) return '📦';
    if (mime.includes('json') || mime.includes('javascript') || mime.includes('html') || mime.includes('css')) return '💻';
    if (mime.startsWith('text/')) return '📝';
    return '📄';
  }

  // ── File handling ──────────────────────────────────────────────────────────
  function addFiles(newFiles) {
    for (const f of newFiles) {
      const id = fileIdCounter++;
      const fieldName = 'file' + (files.length + 1);
      files.push({ id, file: f, fieldName });
    }
    renderFileList();
  }

  function renderFileList() {
    fileList.innerHTML = '';
    if (files.length === 0) return;
    for (const entry of files) {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.dataset.id = entry.id;
      item.innerHTML = `
        <div class="file-icon">${fileIcon(entry.file.type)}</div>
        <div class="file-info">
          <div class="file-name" title="${entry.file.name}">${entry.file.name}</div>
          <div class="file-meta">${formatSize(entry.file.size)} &nbsp;·&nbsp; ${entry.file.type || 'application/octet-stream'}</div>
        </div>
        <input class="file-field-input" type="text" value="${entry.fieldName}" placeholder="field name" title="Multipart field name" />
        <button class="remove-btn" title="Remove">×</button>
      `;
      item.querySelector('.file-field-input').addEventListener('input', e => {
        entry.fieldName = e.target.value;
      });
      item.querySelector('.remove-btn').addEventListener('click', () => {
        files = files.filter(f => f.id !== entry.id);
        renderFileList();
      });
      fileList.appendChild(item);
    }
  }

  fileInput.addEventListener('change', e => { addFiles(Array.from(e.target.files)); fileInput.value = ''; });
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    addFiles(Array.from(e.dataTransfer.files));
  });

  // ── Field rows ─────────────────────────────────────────────────────────────
  function addFieldRow(k = '', v = '') {
    const id = fieldIdCounter++;
    fieldRows.push({ id, key: k, value: v });
    renderFields();
  }

  function renderFields() {
    fieldsList.innerHTML = '';
    for (const row of fieldRows) {
      const div = document.createElement('div');
      div.className = 'field-row';
      div.innerHTML = `
        <input type="text"  value="${escHtml(row.key)}"   placeholder="key"   />
        <input type="text"  value="${escHtml(row.value)}" placeholder="value" />
        <button class="btn-icon" title="Remove">−</button>
      `;
      div.querySelectorAll('input')[0].addEventListener('input', e => row.key   = e.target.value);
      div.querySelectorAll('input')[1].addEventListener('input', e => row.value = e.target.value);
      div.querySelector('button').addEventListener('click', () => {
        fieldRows = fieldRows.filter(r => r.id !== row.id);
        renderFields();
      });
      fieldsList.appendChild(div);
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('add-field-btn').addEventListener('click', () => addFieldRow());

  // ── Send ───────────────────────────────────────────────────────────────────
  sendBtn.addEventListener('click', async () => {
    const url = document.getElementById('url').value.trim();
    if (!url) { alert('Please enter a URL'); return; }

    const fd = new FormData();

    // Extra text fields
    for (const row of fieldRows) {
      if (row.key.trim()) fd.append(row.key.trim(), row.value);
    }

    // Files
    for (const entry of files) {
      const name = entry.fieldName.trim() || 'file';
      fd.append(name, entry.file, entry.file.name);
    }

    sendBtn.classList.add('loading');
    sendBtn.disabled = true;

    const t0 = performance.now();
    try {
      const res = await fetch(url, { method: 'POST', body: fd });
      const elapsed = Math.round(performance.now() - t0);
      const bodyText = await res.text();

      // Collect headers
      const headers = {};
      res.headers.forEach((v, k) => headers[k] = v);

      showResponse({ status: res.status, statusText: res.statusText, headers, body: bodyText, elapsed });
    } catch (err) {
      showError(err.message);
    } finally {
      sendBtn.classList.remove('loading');
      sendBtn.disabled = false;
    }
  });

  // ── Response display ───────────────────────────────────────────────────────
  function statusClass(code) {
    if (code >= 200 && code < 300) return 'status-2xx';
    if (code >= 300 && code < 400) return 'status-3xx';
    if (code >= 400 && code < 500) return 'status-4xx';
    return 'status-5xx';
  }

  function showResponse({ status, statusText, headers, body, elapsed }) {
    responsePanel.style.display = 'block';
    responsePanel.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Meta badges
    document.getElementById('response-meta').innerHTML = `
      <span class="badge ${statusClass(status)}">${status} ${statusText}</span>
      <span class="badge neutral">${elapsed} ms</span>
      <span class="badge neutral">${formatSize(new Blob([body]).size)}</span>
    `;

    // Body
    document.getElementById('response-body').textContent = body || '(empty)';

    // Headers table
    const tbl = document.getElementById('response-headers');
    tbl.innerHTML = Object.entries(headers).map(([k,v]) =>
      `<tr><td>${escHtml(k)}</td><td>${escHtml(v)}</td></tr>`
    ).join('');

    // Raw
    document.getElementById('response-raw').textContent =
      `HTTP ${status} ${statusText}\n` +
      Object.entries(headers).map(([k,v]) => `${k}: ${v}`).join('\n') +
      '\n\n' + body;

    // Reset to body tab
    activateTab('body');
  }

  function showError(msg) {
    responsePanel.style.display = 'block';
    document.getElementById('response-meta').innerHTML =
      `<span class="badge status-4xx">Network Error</span>`;
    document.getElementById('response-body').textContent = msg;
    document.getElementById('response-headers').innerHTML = '';
    document.getElementById('response-raw').textContent = msg;
    activateTab('body');
  }

  // ── Tabs ───────────────────────────────────────────────────────────────────
  function activateTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));
  }
  document.querySelectorAll('.tab').forEach(t =>
    t.addEventListener('click', () => activateTab(t.dataset.tab))
  );
</script>
</body>
</html>
