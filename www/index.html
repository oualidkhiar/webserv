<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebServer Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --border: #1e2230;
      --accent-cgi: #00e5a0;
      --accent-get: #f0a500;
      --accent-post: #4d9fff;
      --accent-delete: #ff4d6d;
      --accent-multi: #c084fc;
      --text: #e2e8f0;
      --muted: #64748b;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      padding: 40px 20px;
    }
    header { text-align: center; margin-bottom: 60px; }
    header h1 {
      font-family: var(--sans);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #00e5a0, #f0a500, #4d9fff, #ff4d6d, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
    .card-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.08em;
    }
    .badge.cgi    { background: rgba(0,229,160,0.15);  color: var(--accent-cgi);    border: 1px solid rgba(0,229,160,0.3); }
    .badge.get    { background: rgba(240,165,0,0.15);   color: var(--accent-get);    border: 1px solid rgba(240,165,0,0.3); }
    .badge.post   { background: rgba(77,159,255,0.15);  color: var(--accent-post);   border: 1px solid rgba(77,159,255,0.3); }
    .badge.delete { background: rgba(255,77,109,0.15);  color: var(--accent-delete); border: 1px solid rgba(255,77,109,0.3); }
    .badge.multi  { background: rgba(192,132,252,0.15); color: var(--accent-multi);  border: 1px solid rgba(192,132,252,0.3); }
    .card-header h2 { font-family: var(--sans); font-size: 1.1rem; font-weight: 700; }
    .card-body { padding: 20px 24px 24px; }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="file"] {
      padding: 8px 12px;
      cursor: pointer;
      color: var(--muted);
    }
    input[type="file"]::file-selector-button {
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 0.8rem;
      cursor: pointer;
      margin-right: 10px;
    }
    input:focus, textarea:focus, select:focus { border-color: #334155; }
    textarea { resize: vertical; min-height: 90px; }

    /* Multipart rows */
    .mp-fields { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .mp-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 6px;
      align-items: center;
    }
    .mp-row input { margin: 0; }
    .mp-file-row { grid-template-columns: 1fr auto; }
    .mp-file-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .mp-remove {
      background: rgba(255,77,109,0.15);
      color: var(--accent-delete);
      border: 1px solid rgba(255,77,109,0.3);
      border-radius: 6px;
      width: 30px;
      height: 34px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .mp-remove:hover { background: rgba(255,77,109,0.3); }
    .add-field-btn {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 7px;
      font-family: var(--mono);
      font-size: 0.78rem;
      cursor: pointer;
      width: 100%;
      transition: border-color 0.2s, color 0.2s;
      margin-bottom: 4px;
    }
    .add-field-btn:hover { border-color: var(--accent-multi); color: var(--accent-multi); }
    .boundary-hint { font-size: 0.7rem; color: var(--muted); margin-top: 6px; opacity: 0.7; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      letter-spacing: 0.03em;
      margin-top: 18px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .btn.cgi    { background: var(--accent-cgi);    color: #000; }
    .btn.get    { background: var(--accent-get);    color: #000; }
    .btn.post   { background: var(--accent-post);   color: #000; }
    .btn.delete { background: var(--accent-delete); color: #fff; }
    .btn.multi  { background: var(--accent-multi);  color: #000; }
    .response-box {
      margin-top: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 60px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    .response-box.visible { display: block; }
    .response-box.ok  { color: var(--accent-cgi);    border-color: rgba(0,229,160,0.3); }
    .response-box.err { color: var(--accent-delete);  border-color: rgba(255,77,109,0.3); }
    .status-line {
      font-size: 0.72rem;
      margin-bottom: 6px;
      font-family: var(--sans);
      font-weight: 700;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
<header>
  <h1>WebServer Tester</h1>
  <p>Test CGI, GET, POST, Multipart, and DELETE endpoints on your local server</p>
</header>
<div class="grid">

  <!-- CGI -->
  <div class="card">
    <div class="card-header">
      <span class="badge cgi">CGI</span>
      <h2>CGI Request</h2>
    </div>
    <div class="card-body">
      <div class="field">
        <label>CGI Path</label>
        <input id="cgi-path" type="text" value="/cgi-bin/script.cgi" placeholder="/cgi-bin/script.cgi"/>
      </div>
      <div class="field">
        <label>Query String (optional)</label>
        <input id="cgi-query" type="text" placeholder="key=value&foo=bar"/>
      </div>
      <div class="field">
        <label>Method</label>
        <select id="cgi-method">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
        </select>
      </div>
      <div class="field" id="cgi-body-field">
        <label>Body (for POST)</label>
        <textarea id="cgi-body" placeholder="name=John&age=30"></textarea>
      </div>
      <button class="btn cgi" onclick="sendCGI()">▶  Send CGI Request</button>
      <div class="response-box" id="cgi-response"></div>
    </div>
  </div>

  <!-- GET -->
  <div class="card">
    <div class="card-header">
      <span class="badge get">GET</span>
      <h2>GET Request</h2>
    </div>
    <div class="card-body">
      <div class="field">
        <label>URL</label>
        <input id="get-url" type="text" value="/api/resource" placeholder="/api/resource"/>
      </div>
      <div class="field">
        <label>Query Parameters (optional)</label>
        <input id="get-query" type="text" placeholder="key=value&foo=bar"/>
      </div>
      <div class="field">
        <label>Extra Headers (JSON, optional)</label>
        <textarea id="get-headers" placeholder='{"Authorization": "Bearer token"}'></textarea>
      </div>
      <button class="btn get" onclick="sendGET()">▶  Send GET Request</button>
      <div class="response-box" id="get-response"></div>
    </div>
  </div>

  <!-- POST -->
  <div class="card">
    <div class="card-header">
      <span class="badge post">POST</span>
      <h2>POST Request</h2>
    </div>
    <div class="card-body">
      <div class="field">
        <label>URL</label>
        <input id="post-url" type="text" value="/api/resource" placeholder="/api/resource"/>
      </div>
      <div class="field">
        <label>Content-Type</label>
        <select id="post-ct">
          <option value="application/json">application/json</option>
          <option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
          <option value="text/plain">text/plain</option>
        </select>
      </div>
      <div class="field">
        <label>Body</label>
        <textarea id="post-body" placeholder='{"key": "value"}'></textarea>
      </div>
      <button class="btn post" onclick="sendPOST()">▶  Send POST Request</button>
      <div class="response-box" id="post-response"></div>
    </div>
  </div>

  <!-- MULTIPART -->
  <div class="card">
    <div class="card-header">
      <span class="badge multi">MULTIPART</span>
      <h2>Multipart Form Data</h2>
    </div>
    <div class="card-body">
      <div class="field">
        <label>URL</label>
        <input id="mp-url" type="text" value="/api/upload" placeholder="/api/upload"/>
      </div>
      <div class="field">
        <label>Text Fields</label>
        <div class="mp-fields" id="mp-text-fields">
          <div class="mp-row">
            <input type="text" placeholder="field name" class="mp-name"/>
            <input type="text" placeholder="value" class="mp-value"/>
            <button class="mp-remove" onclick="removeRow(this)">✕</button>
          </div>
        </div>
        <button class="add-field-btn" onclick="addTextField()">+ Add Text Field</button>
      </div>
      <div class="field">
        <label>File Fields</label>
        <div class="mp-fields" id="mp-file-fields">
          <div class="mp-row mp-file-row">
            <div class="mp-file-inner">
              <input type="text" placeholder="field name" class="mp-fname"/>
              <input type="file" class="mp-file"/>
            </div>
            <button class="mp-remove" onclick="removeRow(this)">✕</button>
          </div>
        </div>
        <button class="add-field-btn" onclick="addFileField()">+ Add File Field</button>
      </div>
      <div class="boundary-hint" id="mp-boundary-display">
        Content-Type: multipart/form-data; boundary=&lt;auto&gt;
      </div>
      <button class="btn multi" onclick="sendMultipart()">▶  Send Multipart Request</button>
      <div class="response-box" id="mp-response"></div>
    </div>
  </div>

  <!-- DELETE -->
  <div class="card">
    <div class="card-header">
      <span class="badge delete">DELETE</span>
      <h2>DELETE Request</h2>
    </div>
    <div class="card-body">
      <div class="field">
        <label>URL</label>
        <input id="del-url" type="text" value="/api/resource/1" placeholder="/api/resource/1"/>
      </div>
      <div class="field">
        <label>Extra Headers (JSON, optional)</label>
        <textarea id="del-headers" placeholder='{"Authorization": "Bearer token"}'></textarea>
      </div>
      <div class="field">
        <label>Body (optional)</label>
        <textarea id="del-body" placeholder="Optional body for DELETE"></textarea>
      </div>
      <button class="btn delete" onclick="sendDELETE()">▶  Send DELETE Request</button>
      <div class="response-box" id="del-response"></div>
    </div>
  </div>

</div>
<script>
  document.getElementById('cgi-method').addEventListener('change', function() {
    document.getElementById('cgi-body-field').style.opacity = this.value === 'POST' ? '1' : '0.4';
  });

  async function display(boxId, res) {
    const box = document.getElementById(boxId);
    box.className = 'response-box visible';
    let body = '';
    try { body = await res.text(); } catch(e) { body = '(no body)'; }
    box.classList.add(res.ok ? 'ok' : 'err');
    box.innerHTML = `<div class="status-line">HTTP ${res.status} ${res.statusText}</div>${escHtml(body)}`;
  }

  async function displayErr(boxId, err) {
    const box = document.getElementById(boxId);
    box.className = 'response-box visible err';
    box.innerHTML = `<div class="status-line">REQUEST FAILED</div>${escHtml(err.message)}`;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendCGI() {
    const path   = document.getElementById('cgi-path').value.trim();
    const query  = document.getElementById('cgi-query').value.trim();
    const method = document.getElementById('cgi-method').value;
    const body   = document.getElementById('cgi-body').value;
    const url    = query ? `${path}?${query}` : path;
    try {
      const opts = { method };
      if (method === 'POST' && body) {
        opts.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
        opts.body = body;
      }
      display('cgi-response', await fetch(url, opts));
    } catch(e) { displayErr('cgi-response', e); }
  }

  async function sendGET() {
    const base   = document.getElementById('get-url').value.trim();
    const query  = document.getElementById('get-query').value.trim();
    const hdrRaw = document.getElementById('get-headers').value.trim();
    const url    = query ? `${base}?${query}` : base;
    let headers  = {};
    if (hdrRaw) {
      try { headers = JSON.parse(hdrRaw); }
      catch(e) { alert('Invalid JSON in headers field'); return; }
    }
    try {
      display('get-response', await fetch(url, { method: 'GET', headers }));
    } catch(e) { displayErr('get-response', e); }
  }

  async function sendPOST() {
    const url  = document.getElementById('post-url').value.trim();
    const ct   = document.getElementById('post-ct').value;
    const body = document.getElementById('post-body').value;
    try {
      display('post-response', await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': ct },
        body
      }));
    } catch(e) { displayErr('post-response', e); }
  }

  // Multipart helpers
  function addTextField() {
    const container = document.getElementById('mp-text-fields');
    const row = document.createElement('div');
    row.className = 'mp-row';
    row.innerHTML = `
      <input type="text" placeholder="field name" class="mp-name"/>
      <input type="text" placeholder="value" class="mp-value"/>
      <button class="mp-remove" onclick="removeRow(this)">✕</button>`;
    container.appendChild(row);
  }

  function addFileField() {
    const container = document.getElementById('mp-file-fields');
    const row = document.createElement('div');
    row.className = 'mp-row mp-file-row';
    row.innerHTML = `
      <div class="mp-file-inner">
        <input type="text" placeholder="field name" class="mp-fname"/>
        <input type="file" class="mp-file"/>
      </div>
      <button class="mp-remove" onclick="removeRow(this)">✕</button>`;
    container.appendChild(row);
  }

  function removeRow(btn) {
    btn.closest('.mp-row').remove();
  }

  async function sendMultipart() {
    const url = document.getElementById('mp-url').value.trim();
    const fd  = new FormData();

    // Append text fields
    document.querySelectorAll('#mp-text-fields .mp-row').forEach(row => {
      const name  = row.querySelector('.mp-name').value.trim();
      const value = row.querySelector('.mp-value').value;
      if (name) fd.append(name, value);
    });

    // Append file fields
    document.querySelectorAll('#mp-file-fields .mp-row').forEach(row => {
      const name      = row.querySelector('.mp-fname').value.trim();
      const fileInput = row.querySelector('.mp-file');
      if (name && fileInput.files.length > 0) {
        fd.append(name, fileInput.files[0], fileInput.files[0].name);
      }
    });

    // Let the browser set Content-Type with the correct boundary automatically
    try {
      display('mp-response', await fetch(url, { method: 'POST', body: fd }));
    } catch(e) { displayErr('mp-response', e); }
  }

  async function sendDELETE() {
    const url    = document.getElementById('del-url').value.trim();
    const hdrRaw = document.getElementById('del-headers').value.trim();
    const body   = document.getElementById('del-body').value.trim();
    let headers  = {};
    if (hdrRaw) {
      try { headers = JSON.parse(hdrRaw); }
      catch(e) { alert('Invalid JSON in headers field'); return; }
    }
    try {
      const opts = { method: 'DELETE', headers };
      if (body) opts.body = body;
      display('del-response', await fetch(url, opts));
    } catch(e) { displayErr('del-response', e); }
  }
</script>
</body>
</html>
